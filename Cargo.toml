[package]
name = "qrawl"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Rust toolkit to crawl web data for AI agents"
repository = "https://github.com/QLangstaff/qrawl"
homepage = "https://github.com/QLangstaff/qrawl"
documentation = "https://docs.rs/qrawl"
readme = "README.md"
keywords = ["crawler", "web-crawling", "scraper", "web-scraping", "rag"]
categories = ["web-programming::http-client", "parsing", "asynchronous", "command-line-utilities"]
rust-version = "1.88"

include = ["Cargo.toml", "README.md", "LICENSE*", "src/**"]

[features]
default = ["cli"]
# The `qrawl` binary and `qrawl::cli`. A library user can drop it with
# `default-features = false`.
cli = ["dep:clap", "dep:env_logger"]

[[bin]]
name = "qrawl"
path = "src/bin/qrawl.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
clap = { version = "4.5", features = ["derive"], optional = true }
reqwest = { version = "0.11", features = ["cookies", "brotli", "gzip", "deflate", "native-tls"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
scraper = "0.19"
htmd = "0.5"
idna = "0.5"
regex = "1.10"
futures-util = "0.3"
dashmap = "6.0"
urlencoding = "2.1"
html-escape = "0.2"
unicode-normalization = "0.1"
once_cell = "1.19"
thiserror = "2.0"
log = "0.4"
env_logger = { version = "0.11", optional = true }
